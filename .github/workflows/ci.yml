name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Start ephemeral PostgreSQL
        shell: bash
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "DB_PASSWORD=$password" >> "$GITHUB_ENV"
          docker run --detach --name teamforge-ci -p 127.0.0.1:5432:5432 \
            -e POSTGRES_DB=teamforge -e POSTGRES_USER=teamforge \
            -e POSTGRES_PASSWORD="$password" postgres:17.7
          for attempt in {1..30}; do
            if docker exec teamforge-ci pg_isready -h 127.0.0.1 -U teamforge -d teamforge; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Compile, migrate and test
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/teamforge
          DB_USERNAME: teamforge
          TEAMFORGE_DATABASE_TESTS: 'true'
        run: mvn --batch-mode --no-transfer-progress verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
      - name: Stop database
        if: always()
        run: docker rm -f teamforge-ci
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Browser interaction and accessibility checks
        run: npm test
